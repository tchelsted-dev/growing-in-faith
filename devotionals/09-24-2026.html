<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Empty Isn't the End &middot; September 24</title>
<style>
  :root{
    --navy-deep:#131F2B;
    --navy:#1F3245;
    --navy-soft:#2C4258;
    --gold:#C89B4A;
    --gold-soft:#8E7440;
    --cream:#F7F1E4;
    --cream-dim:#C9C0AC;
    --sage:#7C9284;
    --sage-deep:#5C7160;
    --line: rgba(200,155,74,0.28);
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
    --sans: 'Avenir Next', 'Century Gothic', 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background: radial-gradient(120% 140% at 50% -10%, var(--navy-soft) 0%, var(--navy) 42%, var(--navy-deep) 100%);
    font-family:var(--sans); color:var(--cream);
  }
  #app{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    height:100dvh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }

  #progress{
    display:flex; gap:6px; justify-content:center;
    padding: 18px 24px 8px;
    flex-shrink:0;
  }
  .dot{
    height:4px; flex:1; max-width:34px; border-radius:2px;
    background: rgba(247,241,228,0.16);
    position:relative; overflow:hidden;
    transition: background 0.35s ease;
  }
  .dot.visited{ background: var(--gold-soft); }
  .dot.current{ background: var(--gold); }

  #viewport{
    flex:1; position:relative; overflow:hidden;
  }
  .scene{
    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:safe center;
    padding: 8px 32px 24px;
    opacity:0; transform: translateX(24px);
    transition: opacity 0.45s ease, transform 0.45s ease;
    pointer-events:none;
    overflow-y:auto;
  }
  .scene.active{
    opacity:1; transform: translateX(0);
    pointer-events:auto;
  }
  .scene.leaving-back{ transform: translateX(-24px); }

  .inner{ max-width: 480px; margin: 0 auto; width:100%; }

  .eyebrow{
    font-family:var(--sans); font-size:11px; letter-spacing:2px;
    color: var(--gold); text-transform:uppercase; margin: 0 0 10px;
    font-weight:600;
  }
  h1.hero{
    font-family:var(--serif); font-weight:700; font-style:normal;
    font-size: clamp(26px, 7.5vw, 38px); line-height:1.18; color:var(--cream);
    margin: 0 0 12px;
  }
  .tagline{
    font-family:var(--serif); font-style:italic; font-size:16px;
    color: var(--cream-dim); line-height:1.5; margin: 0 0 22px;
  }
  .voices{
    display:flex; flex-direction:column; gap:9px; margin-top:6px;
  }
  .voice-line{ font-size:14.5px; line-height:1.5; color:var(--cream-dim); }
  .voice-line b{ color:var(--gold); font-weight:700; letter-spacing:0.5px; }

  .tap-hint{
    margin-top:34px; font-size:12.5px; color: rgba(247,241,228,0.45);
    display:flex; align-items:center; gap:6px;
  }
  .tap-hint svg{ animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge{ 0%,100%{transform:translateX(0);} 50%{transform:translateX(5px);} }

  .ref-link{
    display:inline-block; font-family:var(--sans); font-weight:700;
    font-size:15px; color:var(--gold); text-decoration:none;
    border-bottom: 1px solid var(--gold); padding-bottom:2px; margin-bottom:16px;
  }
  .ref-link:active{ opacity:0.7; }

  p.body-text{
    font-family:var(--serif); font-size:16px; line-height:1.6;
    color: var(--cream); margin: 0 0 18px;
  }
  blockquote{
    margin: 0 0 6px; padding-left:16px; border-left: 2px solid var(--gold);
    font-family:var(--serif); font-style:italic; font-size:18px;
    line-height:1.5; color:var(--cream);
  }
  .cite{
    font-size:12px; color:var(--gold-soft); margin: 0 0 16px 18px;
    letter-spacing:0.3px;
  }

  p.insight{
    font-family:var(--serif); font-style:italic; font-size:15.5px;
    line-height:1.65; color: var(--cream); margin:14px 0 0;
    background: rgba(124,146,132,0.16);
    border-left: 3px solid var(--sage);
    border-radius: 0 8px 8px 0;
    padding: 13px 16px;
  }

  .badge-stack{ display:flex; flex-direction:column; gap:12px; }
  .badge{
    border-radius:10px; padding:16px 18px;
    border:1px solid var(--line);
  }
  .badge.a{ background: rgba(200,155,74,0.10); }
  .badge.b{ background: rgba(124,146,132,0.16); }
  .badge-name{
    font-family:var(--sans); font-weight:700; font-size:12.5px;
    letter-spacing:1.5px; color:var(--gold); margin:0 0 5px;
  }
  .badge-body{
    font-family:var(--serif); font-style:italic; font-size:15px;
    color:var(--cream); margin:0; line-height:1.4;
  }

  .response-card{
    background: linear-gradient(160deg, rgba(200,155,74,0.14), rgba(200,155,74,0.03));
    border:1px solid var(--line); border-radius:12px;
    padding: 26px 22px; text-align:center;
  }
  .response-card p{
    font-family:var(--serif); font-style:italic; font-weight:700;
    font-size:19px; line-height:1.5; color:var(--cream); margin:0;
  }

  .qtext{
    font-family:var(--serif); font-style:italic; font-size:19px;
    line-height:1.55; color:var(--cream); margin:0;
  }

  .prayer-card{
    background: rgba(124,146,132,0.14);
    border:1px solid rgba(124,146,132,0.4); border-radius:12px;
    padding: 22px 20px;
  }
  .prayer-card p{
    font-family:var(--serif); font-style:italic; font-size:15.5px;
    line-height:1.65; color:var(--cream); margin:0;
  }

  .closing-mark{
    font-family:var(--serif); font-weight:700; font-style:italic;
    font-size: clamp(22px, 6.5vw, 28px); line-height:1.4;
    color:var(--cream); text-align:center; margin: 0 0 28px;
  }
  .share-row{
    display:flex; flex-direction:column; gap:10px; align-items:center;
  }
  .btn{
    font-family:var(--sans); font-weight:700; font-size:14px;
    color:var(--navy-deep); background:var(--gold);
    border:none; border-radius:24px; padding:13px 28px;
    cursor:pointer; letter-spacing:0.3px;
  }
  .btn[disabled]{ opacity:0.6; cursor:default; }
  .footnote{
    font-size:10.5px; color: rgba(247,241,228,0.38); text-align:center;
    line-height:1.5; margin-top:22px;
  }

  /* Page 8: shareable photo card */
  .share-card{
    position:relative; border-radius:18px; overflow:hidden;
    aspect-ratio: 4/5; width:100%;
    background-image: url('../assets/backgrounds/ocean%20sunset%20quote.jpg');
    background-size:cover; background-position:center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  .share-overlay{
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(19,31,43,0.10) 0%, rgba(19,31,43,0.55) 55%, rgba(19,31,43,0.90) 100%);
    display:flex; flex-direction:column; justify-content:flex-end;
    padding:26px 22px;
  }
  .share-eyebrow{
    font-family:var(--sans); font-size:10.5px; letter-spacing:2px;
    color:var(--gold); text-transform:uppercase; margin:0 0 10px; font-weight:700;
  }
  .share-tagline{
    font-family:var(--serif); font-weight:700; font-style:italic;
    font-size:22px; line-height:1.35; color:var(--cream); margin:0 0 16px;
  }
  .share-verses{ display:flex; flex-direction:column; gap:10px; }
  .share-verses p{
    font-family:var(--serif); font-style:italic; font-size:12.5px;
    line-height:1.5; color:var(--cream-dim); margin:0;
  }
  .share-verses span{
    display:block; font-family:var(--sans); font-style:normal; font-size:10px;
    letter-spacing:0.5px; color:var(--gold-soft); margin-top:3px;
  }
  .share-actions{ margin-top:20px; display:flex; justify-content:center; }

  #nav{
    flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding: 10px 24px calc(14px + env(safe-area-inset-bottom));
    gap:14px;
  }
  .navbtn{
    font-family:var(--sans); font-size:13px; font-weight:700;
    color: var(--cream); background: rgba(247,241,228,0.08);
    border:1px solid rgba(247,241,228,0.14); border-radius:22px;
    padding: 11px 20px; cursor:pointer; letter-spacing:0.3px;
    display:flex; align-items:center; gap:6px;
    transition: opacity 0.2s ease;
  }
  .navbtn[disabled]{ opacity:0.25; pointer-events:none; }
  .navbtn.primary{ background: var(--gold); color: var(--navy-deep); border-color:transparent; }
  .navlabel{
    font-size:11px; color: rgba(247,241,228,0.4); letter-spacing:1px;
    font-family:var(--sans);
  }

  @media (prefers-reduced-motion: reduce){
    .scene, .tap-hint svg { transition:none; animation:none; }
  }

  @media (min-width:640px){
    .scene{ padding: 8px 60px 24px; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="progress"></div>
  <div id="viewport"></div>
  <div id="nav">
    <button class="navbtn" id="backBtn">&#8592; Back</button>
    <span class="navlabel" id="navLabel">1 / 8</span>
    <button class="navbtn primary" id="nextBtn">Next &#8594;</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const RUT_LINK = "https://www.bible.com/bible/116/RUT.1.1-21.NLT";
const JOHN_LINK = "https://www.bible.com/bible/116/JHN.4.4-26.NLT";
const SHARE_TAGLINE = "Empty isn't the end of the story.";
const SHARE_FILENAME = "growing-in-faith-09-24-2026.png";

const scenes = [
  {
    key:"intro",
    render: () => `
      <div class="inner">
        <p class="eyebrow">September 24 &middot; Devotional</p>
        <h1 class="hero">Empty Isn't<br/>the End</h1>
        <p class="tagline">For the days you feel like there's nothing left to give.</p>
        <div class="voices">
          <p class="voice-line"><b>NAOMI</b> &nbsp;I came home with nothing left to offer.</p>
          <p class="voice-line"><b>THE WOMAN AT THE WELL</b> &nbsp;I came at noon so no one would see me.</p>
        </div>
        <div class="tap-hint">
          Swipe or tap Next to begin
          <svg width="14" height="10" viewBox="0 0 14 10" fill="none"><path d="M1 5H13M13 5L9 1M13 5L9 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>`
  },
  {
    key:"naomi",
    render: () => `
      <div class="inner">
        <p class="eyebrow">1 of 2 &middot; Naomi</p>
        <a class="ref-link" href="${RUT_LINK}" target="_blank" rel="noopener">Ruth 1:1&ndash;21 &#8599;</a>
        <p class="body-text">Naomi left Bethlehem with a husband, two sons, and a plan. She came back ten years later with none of it. Both sons were gone. Her husband was gone. The famine that pushed her family out had finally ended, but going home didn't feel like relief. It felt like showing up with nothing to show for the years in between.</p>
        <blockquote>&ldquo;Call me Mara, for the Almighty has made life very bitter for me.&rdquo;</blockquote>
        <p class="cite">Ruth 1:20, NLT</p>
        <p class="insight">She didn't fake her way through that reunion. She said the true thing out loud, even the ugly parts. That's not a lack of faith. That might be where faith actually starts.</p>
      </div>`
  },
  {
    key:"well",
    render: () => `
      <div class="inner">
        <p class="eyebrow">2 of 2 &middot; The Woman at the Well</p>
        <a class="ref-link" href="${JOHN_LINK}" target="_blank" rel="noopener">John 4:4&ndash;26 &#8599;</a>
        <p class="body-text">She came to draw water at noon, the hottest part of the day, when nobody else would be out there. That timing wasn't random. Five marriages and a complicated present had probably made her someone the other women avoided. Jesus sat down at that well anyway and asked her for a drink, and the conversation went somewhere she wasn't expecting.</p>
        <blockquote>&ldquo;It becomes a fresh, bubbling spring within them, giving them eternal life.&rdquo;</blockquote>
        <p class="cite">John 4:14, NLT</p>
        <p class="insight">He didn't send her to clean herself up first. He met her at the well, in the heat, with her whole complicated life still showing, and offered her something real anyway.</p>
      </div>`
  },
  {
    key:"badges",
    render: () => `
      <div class="inner">
        <p class="eyebrow">The two voices</p>
        <div class="badge-stack">
          <div class="badge a">
            <p class="badge-name">NAOMI</p>
            <p class="badge-body">Empty doesn't mean forgotten.</p>
          </div>
          <div class="badge b">
            <p class="badge-name">THE WOMAN AT THE WELL</p>
            <p class="badge-body">Seen before I was ready to be seen.</p>
          </div>
        </div>
      </div>`
  },
  {
    key:"response",
    render: () => `
      <div class="inner">
        <p class="eyebrow">My response</p>
        <div class="response-card">
          <p>&ldquo;Lord, I don't have anything impressive to bring today. Meet me here anyway.&rdquo;</p>
        </div>
      </div>`
  },
  {
    key:"question",
    render: () => `
      <div class="inner">
        <p class="eyebrow">Question to sit with</p>
        <p class="qtext">What's one place in your life right now where you feel like you're showing up with nothing left to give?</p>
      </div>`
  },
  {
    key:"prayer_closing",
    render: () => `
      <div class="inner">
        <p class="eyebrow">Prayer</p>
        <div class="prayer-card">
          <p>God, some days I feel like Naomi, coming home with less than I left with. Other days I feel like the woman at the well, hoping nobody looks too closely at my life. Thank you for meeting both of those versions of me without waiting for me to clean anything up first. Help me believe that empty isn't the end of my story. Keep filling what feels used up. Amen.</p>
        </div>
        <p class="closing-mark" style="margin-top:26px;">Empty isn't the end of the story.<br/>It might be exactly where you get seen.</p>
        <div class="share-row">
          <button class="btn" id="restartBtn">Start again</button>
        </div>
        <p class="footnote">Scripture readings: Ruth 1:1&ndash;21 and John 4:4&ndash;26.<br/>Scripture quotations marked NLT are taken from the Holy Bible, New Living Translation, copyright &copy; 1996, 2004, 2015 by Tyndale House Foundation. Used by permission of Tyndale House Publishers, Inc., Carol Stream, Illinois 60188. All rights reserved.</p>
      </div>`
  },
  {
    key:"share",
    render: () => `
      <div class="inner share-scene">
        <p class="eyebrow">Share this one</p>
        <div class="share-card" id="shareCard">
          <div class="share-overlay">
            <p class="share-eyebrow">Growing in Faith &middot; Walking Together</p>
            <p class="share-tagline">${SHARE_TAGLINE}</p>
            <div class="share-verses">
              <p>&ldquo;Call me Mara, for the Almighty has made life very bitter for me.&rdquo;<span>Ruth 1:20, NLT</span></p>
              <p>&ldquo;It becomes a fresh, bubbling spring within them, giving them eternal life.&rdquo;<span>John 4:14, NLT</span></p>
            </div>
          </div>
        </div>
        <div class="share-actions">
          <button class="btn" id="shareBtn">Share image</button>
        </div>
      </div>`
  },
];

let current = 0;
const viewport = document.getElementById('viewport');
const progress = document.getElementById('progress');
const backBtn = document.getElementById('backBtn');
const nextBtn = document.getElementById('nextBtn');
const navLabel = document.getElementById('navLabel');

function buildDom(){
  scenes.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'scene';
    div.dataset.index = i;
    div.innerHTML = s.render();
    viewport.appendChild(div);
  });
  for(let i=0;i<scenes.length;i++){
    const d = document.createElement('div');
    d.className = 'dot';
    progress.appendChild(d);
  }
}

function render(){
  const sceneEls = viewport.querySelectorAll('.scene');
  sceneEls.forEach((el, i) => {
    el.classList.remove('active','leaving-back');
    if(i === current){
      el.classList.add('active');
    } else if (i < current) {
      el.classList.add('leaving-back');
    }
  });
  const dots = progress.querySelectorAll('.dot');
  dots.forEach((d,i) => {
    d.classList.toggle('current', i === current);
    d.classList.toggle('visited', i < current);
  });
  backBtn.disabled = current === 0;
  nextBtn.innerHTML = current === scenes.length - 1 ? 'Restart &#8635;' : 'Next &#8594;';
  navLabel.textContent = `${current + 1} / ${scenes.length}`;

  const restartBtn = document.getElementById('restartBtn');
  if(restartBtn){
    restartBtn.onclick = () => { current = 0; render(); };
  }

  const shareBtn = document.getElementById('shareBtn');
  if(shareBtn){
    shareBtn.onclick = async () => {
      const card = document.getElementById('shareCard');
      if(!card || typeof html2canvas === 'undefined') return;
      const originalLabel = shareBtn.textContent;
      shareBtn.disabled = true;
      shareBtn.textContent = 'Preparing...';
      try{
        const canvas = await html2canvas(card, {useCORS:true, scale:2, backgroundColor:null});
        canvas.toBlob(async (blob) => {
          if(!blob){
            shareBtn.disabled = false;
            shareBtn.textContent = originalLabel;
            return;
          }
          const file = new File([blob], SHARE_FILENAME, {type:'image/png'});
          let shared = false;
          if(navigator.canShare && navigator.canShare({files:[file]})){
            try{
              await navigator.share({files:[file], title:'Growing in Faith', text: SHARE_TAGLINE});
              shared = true;
            }catch(err){ /* user cancelled, fall back to download */ }
          }
          if(!shared){
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = SHARE_FILENAME;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
          }
          shareBtn.disabled = false;
          shareBtn.textContent = originalLabel;
        }, 'image/png');
      }catch(err){
        shareBtn.disabled = false;
        shareBtn.textContent = originalLabel;
      }
    };
  }
}

function go(delta){
  const target = current + delta;
  if(target < 0) return;
  if(target > scenes.length - 1){
    current = 0; render(); return;
  }
  current = target;
  render();
}

backBtn.addEventListener('click', () => go(-1));
nextBtn.addEventListener('click', () => go(1));

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight') go(1);
  if(e.key === 'ArrowLeft') go(-1);
});

let touchStartX = null;
viewport.addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
}, {passive:true});
viewport.addEventListener('touchend', (e) => {
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 45){
    if(dx < 0) go(1); else go(-1);
  }
  touchStartX = null;
}, {passive:true});

buildDom();
render();
</script>

</body>
</html>
